<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CS.gl renderer test</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101216; }
  #c { display: block; width: 100vw; height: 100vh; }
  #info {
    position: fixed; left: 8px; top: 8px; z-index: 9; pointer-events: none;
    color: #d8f0ff; font: 12px/1.5 Consolas, monospace; white-space: pre;
    background: rgba(0,0,0,0.45); padding: 6px 8px; border-radius: 4px;
  }
  #err {
    position: fixed; left: 8px; bottom: 8px; right: 8px; z-index: 10; display: none;
    color: #ff7060; font: 13px/1.45 Consolas, monospace; white-space: pre-wrap;
    background: rgba(0,0,0,0.7); padding: 8px; border-radius: 4px; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">boot…</div>
<div id="err"></div>

<script>
  window.__ERRORS__ = [];
  function reportErr(msg) {
    try {
      window.__ERRORS__.push(String(msg));
      var el = document.getElementById('err');
      el.style.display = 'block';
      el.textContent = window.__ERRORS__.join('\n');
      document.title = 'ERR';
    } catch (e) { }
  }
  window.onerror = function (msg, src, line, col, err) {
    reportErr('ERROR: ' + msg + ' @ ' + src + ':' + line + (err && err.stack ? '\n' + err.stack : ''));
    return false;
  };
  window.addEventListener('unhandledrejection', function (e) {
    reportErr('UNHANDLED: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
  });
</script>
<script src="../js/math.js"></script>
<script src="../js/glcore.js"></script>
<script src="../js/fx.js"></script>
<script>
(function () {
  'use strict';
  var INFO = document.getElementById('info');

  function qs(name, def) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : def;
  }

  try {
    main();
  } catch (e) {
    reportErr('THROW: ' + e.message + '\n' + (e.stack || ''));
    INFO.textContent = 'THROW: ' + e.message;
  }

  function main() {
    var canvas = document.getElementById('c');
    var R = CS.gl.init(canvas);
    R.resize();

    if (R.isNull) {
      reportErr('NO WEBGL CONTEXT: ' + (R.error || 'unknown'));
      INFO.textContent = 'NO WEBGL CONTEXT\n' + (R.error || '');
      return;
    }

    var M4 = CS.math.M4;
    var fx = CS.fx;

    /* ---------------- camera from query ---------------- */
    var eye = [0, 1.62, 9];
    var yaw = 0.0, pitch = 0.03, fov = 90;
    var look = qs('look', 'scene');
    if (look === 'sun') { eye = [0, 1.62, 6]; yaw = 0.3; pitch = 0.62; }
    else if (look === 'close') { eye = [0, 1.65, 1.0]; yaw = 0.05; pitch = 0.12; }
    else if (look === 'overview') { eye = [12, 9, 18]; yaw = -0.55; pitch = -0.32; }
    if (qs('yaw')) yaw = parseFloat(qs('yaw'));
    if (qs('pitch')) pitch = parseFloat(qs('pitch'));
    if (qs('fov')) fov = parseFloat(qs('fov'));
    var nofx = qs('nofx', '0') === '1';
    var customFrame = qs('custom', '0') === '1';
    var noFloor = qs('nofloor', '0') === '1';
    var texView = look === 'tex';
    if (texView) { eye = [0, 2.6, 8.5]; yaw = 0; pitch = 0.0; }

    /* ---------------- static floor mesh (tests createMesh/drawMesh) ---------------- */
    var floorMesh = (function () {
      var N = 32, size = 96, half = size / 2;
      var verts = [], idx = [];
      var x, z;
      for (z = 0; z <= N; z++) {
        for (x = 0; x <= N; x++) {
          var wx = -half + x * (size / N);
          var wz = -half + z * (size / N);
          verts.push(wx, 0, wz, 0, 1, 0, wx / 4, wz / 4);
        }
      }
      for (z = 0; z < N; z++) {
        for (x = 0; x < N; x++) {
          var a = z * (N + 1) + x, b = a + 1, c = a + N + 1, d = c + 1;
          idx.push(a, c, b, b, c, d);
        }
      }
      return CS.gl.createMesh(new Float32Array(verts), new Uint16Array(idx), 'sandfloor');
    })();

    /* ---------------- scene description ---------------- */
    var boxes = [];
    var shadows = [];
    var decals = [];
    var sprites = [];

    function addBox(tex, x, y, z, sx, sy, sz, tint, rotY, uv) {
      boxes.push({ tex: tex, x: x, y: y, z: z, sx: sx, sy: sy, sz: sz, tint: tint || null, rot: rotY || 0, uv: uv || 1 });
    }
    function addShadow(x, z, r, a) { shadows.push({ x: x, z: z, r: r, a: a === undefined ? 0.42 : a }); }
    function addDecal(x, z, r, col) { decals.push({ x: x, z: z, r: r, col: col }); }

    /* perimeter walls: several materials so every wall texture shows up */
    var wallTex = ['wall', 'wall2', 'brick', 'wall', 'concrete', 'wall2'];
    for (var i = 0; i < 6; i++) {
      addBox(wallTex[i], -20 + i * 8, 3.5, -16, 8.0, 7, 0.9, null, 0, 3.2);
    }
    for (i = 0; i < 3; i++) {
      addBox(i % 2 ? 'brick' : 'wall2', -24, 3.5, -8 + i * 8, 0.9, 7, 8, null, 0, 3.2);
      addBox(i % 2 ? 'wall' : 'concrete', 24, 3.5, -8 + i * 8, 0.9, 7, 8, null, 0, 3.2);
    }
    addBox('wall2', 0, 3.5, 16, 48, 7, 0.9, null, 0, 6);

    /* mid cover: concrete barriers, metal crate, wood stack */
    addBox('concrete', -2, 0.65, -9.5, 5.0, 1.3, 0.7, null, 0.12, 2.0);
    addBox('concrete', 5.5, 0.65, -12.0, 4.0, 1.3, 0.7, null, -0.08, 2.0);
    addBox('metal', -8.5, 1.4, -11.5, 3.2, 2.8, 5.2, [0.86, 0.9, 0.94], 0.15, 2.0);
    addBox('wood', 7.5, 0.5, -8.0, 3.0, 1.0, 1.8, null, 0.2, 1.5);
    addBox('wood', 7.5, 1.2, -8.0, 2.2, 0.4, 1.4, null, -0.12, 1.5);

    /* crates (dust2 flavour) */
    var crates = [
      [-4.0, -5.6, 1.0, null, 0.0],
      [-4.0, -5.6, 0.86, null, 0.35],  /* stacked helper: y set below */
      [-2.7, -6.2, 1.0, [1.0, 0.94, 0.84], 0.12],
      [4.3, -6.4, 1.0, null, 0.4],
      [5.4, -6.9, 0.8, null, 0.9],
      [-6.0, -3.0, 1.0, [0.95, 0.9, 0.82], 0.25],
      [1.2, -12.5, 1.0, null, 0.6]
    ];
    addBox('crate', -4.0, 0.5, -5.6, 1.0, 1.0, 1.0, null, 0.0, 1);
    addBox('crate', -4.0, 1.42, -5.6, 0.84, 0.84, 0.84, null, 0.35, 1);
    for (i = 2; i < crates.length; i++) {
      var cr = crates[i];
      addBox('crate', cr[0], cr[2] * 0.5, cr[1], cr[2], cr[2], cr[2], cr[3], cr[4], 1);
    }
    addShadow(-4.0, -5.6, 1.1, 0.45);
    addShadow(-2.7, -6.2, 0.8, 0.4);
    addShadow(4.3, -6.4, 0.9, 0.4);

    /* sandbag line + tinted white boxes (tint test) */
    addBox('white', 8.5, 0.3, -4.0, 4.0, 0.6, 0.9, [0.72, 0.62, 0.42], 0.05, 1);
    addBox('white', 8.5, 0.85, -4.2, 3.2, 0.5, 0.8, [0.66, 0.56, 0.37], 0.09, 1);
    addBox('white', 11.0, 0.75, -9.0, 1.4, 1.5, 1.4, [0.3, 0.55, 0.85], 0.0, 1);
    addBox('white', 12.6, 0.5, -8.4, 1.0, 1.0, 1.0, [0.85, 0.35, 0.2], 0.0, 1);

    /* two simple box soldiers (bot scale) */
    function soldier(x, z, ct) {
      var cloth = ct ? [0.22, 0.29, 0.42] : [0.56, 0.46, 0.27];
      var pants = ct ? [0.17, 0.23, 0.33] : [0.44, 0.36, 0.21];
      var skin = [0.72, 0.56, 0.42];
      addBox('white', x, 0.47, z, 0.2, 0.94, 0.22, pants, 0, 1);
      addBox('white', x + 0.2, 0.47, z, 0.2, 0.94, 0.22, pants, 0, 1);
      addBox('white', x + 0.1, 1.28, z, 0.62, 0.72, 0.34, cloth, 0, 1);
      addBox('white', x + 0.1, 1.72, z, 0.26, 0.26, 0.26, skin, 0, 1);
      addBox('white', x - 0.24, 1.3, z, 0.16, 0.6, 0.17, cloth, 0, 1);
      addBox('white', x + 0.44, 1.3, z, 0.16, 0.6, 0.17, cloth, 0, 1);
      addBox('metal', x + 0.3, 1.34, z + 0.28, 0.09, 0.12, 0.75, [0.2, 0.21, 0.23], 0, 1);
      addShadow(x + 0.1, z, 0.55, 0.45);
    }
    soldier(2.2, -2.6, true);
    soldier(-0.8, -4.6, false);

    /* site markers */
    addDecal(-9, -6, 3.2, [1.0, 0.42, 0.12, 0.8]);
    addDecal(9.5, -10.5, 3.2, [0.2, 0.5, 1.0, 0.8]);
    addShadow(2.2, -2.6, 0.6, 0.4);

    /* static sprite texture showcase (all fx textures visible) */
    sprites.push({ tex: 'spark', x: -2.2, y: 1.5, z: -3.4, s: 0.5, c: [1, 0.85, 0.5, 0.95], add: true });
    sprites.push({ tex: 'muzzle', x: 0.0, y: 1.6, z: -3.4, s: 0.7, c: [1, 0.95, 0.8, 0.95], add: true });
    sprites.push({ tex: 'smoke', x: 2.1, y: 1.5, z: -3.4, s: 0.8, c: [0.85, 0.8, 0.7, 0.5], add: false });
    sprites.push({ tex: 'blood', x: 4.1, y: 1.4, z: -3.4, s: 0.45, c: [0.9, 0.55, 0.5, 0.85], add: false });
    sprites.push({ tex: 'shadow', x: -1.0, y: 0.03, z: 1.0, s: 2.0, c: [0, 0, 0, 0.4], add: false });

    /* ---------------- texture inspection grid (?look=tex) ---------------- */
    var texBoxes = [];
    if (texView) {
      var names = CS.gl.texNames;
      for (i = 0; i < names.length; i++) {
        var col = i % 5, row = (i / 5) | 0;
        texBoxes.push({
          tex: names[i],
          x: (col - 2) * 1.95,
          y: 4.05 - row * 1.9,
          z: -4,
          s: 1.7
        });
      }
    }

    /* ---------------- periodic fx ---------------- */
    var fxAcc = 0;
    function spawnFx() {
      var to = [
        -6 + Math.random() * 12,
        0.8 + Math.random() * 2.6,
        -15.5
      ];
      fx.tracer([0.25, 1.35, 7.9], to, [1.0, 0.86, 0.58]);
      fx.impact(to, [0, 0, 1], Math.random() < 0.5 ? 'wall' : 'brick');
      fx.muzzle([0.32, 1.3, 6.8], [0, 0, -1], 1.0);
      fx.shell([0.42, 1.28, 6.8], [1, 0.7, 0.1]);
      if (Math.random() < 0.3) fx.blood([-0.8, 1.5, -4.4], [0, 0, -1]);
      if (Math.random() < 0.35) fx.tracer([-9, 3.0, -15.2], [4, 1.2, -6], [1.0, 0.5, 0.2]);
    }

    /* ---------------- render loop ---------------- */
    var last = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    var frames = 0, clock = 0;
    function updateInfo() {
      var c = R.camera;
      INFO.textContent =
        'GL renderer: ' + (R.isNull ? 'NULL' : 'OK') +
        '  textures=' + R.texNames.length +
        '\ndraws=' + R.stats.draws + '  tris=' + (R.stats.tris | 0) +
        '  objects=' + (R.stats.objects || 0) +
        '  particles=' + fx.count() +
        '\nfovH=' + c.fovDeg + '  cam=(' + c.eye.map(function (v) { return v.toFixed(2); }).join(', ') + ')' +
        '\nframes=' + frames + '  time=' + clock.toFixed(2) + 's' +
        (window.__ERRORS__.length ? '\nERRORS=' + window.__ERRORS__.length : '');
    }

    function tick(dt) {
      clock += dt; frames++;

      if (!nofx) {
        fxAcc += dt;
        if (fxAcc >= 0.22) { fxAcc = 0; spawnFx(); }
      }
      fx.update(dt);

      R.setCamera(eye, yaw, pitch, fov);
      if (customFrame) {
        R.beginFrame({
          skyTop: [0.24, 0.36, 0.55],
          skyBottom: '#f0d6a2',
          fogColor: [0.76, 0.66, 0.48],
          fogNear: 6,
          fogFar: 55
        });
      } else {
        R.beginFrame();
      }

      if (!noFloor) R.drawMesh(floorMesh);

      var i, b, m;

      if (texView) {
        for (i = 0; i < texBoxes.length; i++) {
          var tb = texBoxes[i];
          m = M4.translation(tb.x, tb.y, tb.z);
          m = M4.multiply(m, M4.rotationX(0.12));
          m = M4.multiply(m, M4.scaling(tb.s, tb.s, 0.18));
          R.drawBox(tb.tex, m, null, 1);
        }
        fx.render(R);
        R.endFrame();
        updateInfo();
        return;
      }

      for (i = 0; i < boxes.length; i++) {
        b = boxes[i];
        m = M4.translation(b.x, b.y, b.z);
        if (b.rot) m = M4.multiply(m, M4.rotationY(b.rot));
        m = M4.multiply(m, M4.scaling(b.sx, b.sy, b.sz));
        R.drawBox(b.tex, m, b.tint, b.uv);
      }

      for (i = 0; i < shadows.length; i++) {
        var s = shadows[i];
        R.drawShadow([s.x, 0, s.z], s.r, s.a);
      }
      for (i = 0; i < decals.length; i++) {
        var d = decals[i];
        R.drawGroundDecal([d.x, 0, d.z], d.r, d.col);
      }
      for (i = 0; i < sprites.length; i++) {
        var sp = sprites[i];
        R.drawSprite(sp.tex, [sp.x, sp.y, sp.z], sp.s, sp.c, sp.add);
      }

      /* direct beam coverage (also exercised by fx.tracer every 0.22s) */
      R.drawBeam([-7.5, 2.6, -13.0], [5.5, 1.2, -4.0], 0.05, [1.0, 0.86, 0.58, 0.75]);
      R.drawBeam([6.5, 3.4, -12.0], [-3.5, 1.5, -2.0], 0.04, [1.0, 0.42, 0.2, 0.6]);

      fx.render(R);
      R.endFrame();
      updateInfo();
    }

    window.__TEST__ = {
      renderer: R,
      fx: fx,
      errors: window.__ERRORS__,
      frameCount: function () { return frames; },
      scene: { boxes: boxes.length, shadows: shadows.length, decals: decals.length }
    };
    document.title = 'CS.gl OK';

    /* Synchronous first frame: guarantees a complete screenshot even when the
       headless browser only runs a single animation frame. */
    if (!nofx) spawnFx();
    tick(0.016);

    function loop() {
      var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      tick(dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
