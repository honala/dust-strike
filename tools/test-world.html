<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>world self-test — Dust Strike map</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #12100c; }
  body { font-family: "Segoe UI", "Microsoft YaHei", monospace; color: #e8e2d4; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #panel {
    position: fixed; left: 14px; top: 14px; z-index: 10; pointer-events: none;
    background: rgba(12, 10, 6, 0.78); border: 1px solid #6b5730; border-radius: 6px;
    padding: 10px 14px; font-size: 12px; line-height: 1.6; color: #d9cba8; max-width: 560px;
    white-space: pre; font-family: Consolas, "Courier New", monospace;
  }
  #panel b { color: #f0c96a; }
  #err {
    position: fixed; left: 14px; bottom: 14px; right: 14px; z-index: 20;
    color: #ff7a5c; font-size: 13px; font-family: Consolas, monospace; white-space: pre-wrap;
    background: rgba(30, 6, 4, 0.9); border: 1px solid #7a2a1c; border-radius: 6px;
    padding: 8px 12px; display: none;
  }
  #legend {
    position: fixed; right: 14px; bottom: 14px; z-index: 10; pointer-events: none;
    background: rgba(12, 10, 6, 0.78); border: 1px solid #6b5730; border-radius: 6px;
    padding: 8px 12px; font-size: 12px; line-height: 1.7; color: #cdbf9d;
    font-family: Consolas, monospace; white-space: pre;
  }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="panel"></div>
<div id="legend"></div>
<div id="err"></div>

<script src="../js/math.js"></script>
<script src="../js/glcore.js"></script>
<script src="../js/world.js"></script>
<script>
(function () {
  'use strict';
  var errBox = document.getElementById('err');
  var errors = [];
  function showErr(msg) {
    errors.push(String(msg));
    errBox.style.display = 'block';
    errBox.textContent = 'ERRORS:\n' + errors.slice(0, 8).join('\n');
  }
  window.addEventListener('error', function (e) {
    showErr((e.message || 'error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
  });

  var params = new URLSearchParams(location.search);
  var view = params.get('view') || 'top';
  var canvas = document.getElementById('view');
  var panel = document.getElementById('panel');
  var legend = document.getElementById('legend');

  if (!window.CS || !CS.math || !CS.world) {
    showErr('CS.math / CS.world missing — script load failed?');
    panel.textContent = 'load failure';
    return;
  }

  var W = CS.world;
  var renderer = null;
  if (view !== 'top') {
    /* CS.gl.init must run before world.init so createMesh has a live context */
    try {
      renderer = CS.gl.init(canvas);
    } catch (e) {
      showErr('CS.gl.init: ' + (e && e.message ? e.message : e));
      return;
    }
  }
  try {
    W.init({ canvas: canvas, renderer: renderer });
  } catch (e) {
    showErr('world.init: ' + (e && e.message ? e.message : e));
    panel.textContent = 'world.init failed';
    return;
  }

  var stats = W.stats || {};
  var info =
    'DUST STRIKE — world self-test (' + view + ')\n' +
    'boxes ' + stats.boxes + '  tris ' + stats.tris + '  verts ' + stats.verts +
    '  meshes ' + stats.meshes + '\n' +
    'nav ' + stats.navCells + ' cells, walkable ' + stats.walkableCells + ' (0.75m)\n' +
    'CT spawn[0] (' + W.spawns.ct[0].pos[0].toFixed(1) + ', ' + W.spawns.ct[0].pos[2].toFixed(1) + ')  ' +
    'sites A(' + W.sites.A.center + ') B(' + W.sites.B.center + ')';

  /* ------------------------------------------------------------------ 2D top */
  function drawTop() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0e0c09';
    ctx.fillRect(0, 0, innerWidth, innerHeight);

    var sx = (innerWidth - 80) / 64, sz = (innerHeight - 110) / 68;
    var s = Math.min(sx, sz);
    var ox = (innerWidth - 64 * s) * 0.5, oy = (innerHeight - 68 * s) * 0.5 + 6;
    function px(x) { return ox + (x + 32) * s; }
    function pz(z) { return oy + (z + 34) * s; }

    /* walls / solid cells */
    var solid = W.grid.solid();
    for (var j = 0; j < 68; j++) {
      for (var i = 0; i < 64; i++) {
        if (!solid[j * 64 + i]) continue;
        ctx.fillStyle = '#2a2620';
        ctx.fillRect(px(-32 + i), pz(-34 + j), s + 0.5, s + 0.5);
      }
    }
    /* walkable nav cells */
    var navW = W.navGrid.getWidth(), navH = W.navGrid.getHeight();
    var walk = W.navGrid.walkable();
    var cell = W.navGrid.getCell();
    for (j = 0; j < navH; j++) {
      for (i = 0; i < navW; i++) {
        if (!walk[j * navW + i]) continue;
        var cx = -32 + (i + 0.5) * cell, cz = -34 + (j + 0.5) * cell;
        ctx.fillStyle = 'rgba(196, 170, 120, 0.30)';
        ctx.fillRect(px(cx) - s * cell * 0.5, pz(cz) - s * cell * 0.5, s * cell + 0.3, s * cell + 0.3);
      }
    }
    /* collision boxes (props drawn brighter, walls darker) */
    var KIND_COLOR = {
      crate: '#a06a33', wood: '#8a6a3c', metal: '#7d8589', concrete: '#9b917d',
      brick: '#7d4a30', wall: '#5d5545', wall2: '#6a6353', floor: null
    };
    for (var k = 0; k < W.boxes.length; k++) {
      var b = W.boxes[k];
      if (b.floor) continue;
      var isProp = W.propBoxes.indexOf(b) >= 0;
      var col = KIND_COLOR[b.kind] || '#666';
      ctx.fillStyle = col;
      ctx.globalAlpha = isProp ? 0.95 : 0.45;
      ctx.fillRect(px(b.min[0]), pz(b.min[2]), (b.max[0] - b.min[0]) * s, (b.max[2] - b.min[2]) * s);
      ctx.globalAlpha = 1;
    }
    /* zones */
    var ZONE_STYLE = {
      tSpawn: '#f0a030', ctSpawn: '#4f8fe8', mid: '#d8d08a', siteA: '#ff6a3c',
      siteB: '#4f9cff', longA: '#e0c070', longB: '#e0c070', tunnels: '#b98bd8'
    };
    ctx.lineWidth = 2;
    for (var zn in W.zones) {
      var zone = W.zones[zn];
      ctx.strokeStyle = ZONE_STYLE[zn] || '#fff';
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      for (var pI = 0; pI < zone.points.length; pI++) {
        var pt = zone.points[pI];
        if (pI === 0) ctx.moveTo(px(pt[0]), pz(pt[1]));
        else ctx.lineTo(px(pt[0]), pz(pt[1]));
      }
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = ZONE_STYLE[zn] || '#fff';
      ctx.font = 'bold 11px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(zn, px(zone.center[0]), pz(zone.center[1]) + 4);
      ctx.globalAlpha = 1;
    }
    /* sites */
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ff5a2a';
    ctx.beginPath();
    ctx.arc(px(W.sites.A.center[0]), pz(W.sites.A.center[1]), W.sites.A.radius * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#3d86ff';
    ctx.beginPath();
    ctx.arc(px(W.sites.B.center[0]), pz(W.sites.B.center[1]), W.sites.B.radius * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.font = 'bold 22px Consolas, monospace';
    ctx.fillStyle = '#ff7a45';
    ctx.fillText('A', px(-17), pz(-6) - 8);
    ctx.fillStyle = '#5b9bff';
    ctx.fillText('B', px(17), pz(-4) - 8);
    /* spawns */
    function drawSpawns(list, col) {
      for (var n = 0; n < list.length; n++) {
        var sp = list[n];
        var x = px(sp.pos[0]), z = pz(sp.pos[2]);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(x, z, 4, 0, Math.PI * 2);
        ctx.fill();
        var fx = Math.sin(sp.yaw), fz = -Math.cos(sp.yaw);
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, z);
        ctx.lineTo(x + fx * 18, z + fz * 18);
        ctx.stroke();
      }
    }
    drawSpawns(W.spawns.ct, '#7fb0ff');
    drawSpawns(W.spawns.t, '#ffbf5a');

    panel.textContent = info;
    legend.innerHTML =
      '<span class="sw" style="background:#2a2620"></span>solid wall block\n' +
      '<span class="sw" style="background:rgba(196,170,120,.5)"></span>nav walkable (0.75m)\n' +
      '<span class="sw" style="background:#a06a33"></span>props / cover\n' +
      '<span class="sw" style="background:#ff6a3c"></span>site / zones\n' +
      '<span class="sw" style="background:#7fb0ff"></span>CT spawn   ' +
      '<span class="sw" style="background:#ffbf5a"></span>T spawn\n' +
      'blue arrow = yaw';
  }

  /* ------------------------------------------------------------------ 3D */
  var VIEWS = {
    over: function () {
      return { eye: [0, 64, 0.5], yaw: 0, pitch: -Math.PI * 0.499, fov: 80 };
    },
    aerial3q: function () {
      return { eye: [0, 42, 54], yaw: 0, pitch: -0.66, fov: 90 };
    },
    ctspawn: function () {
      var sp = W.spawns.ct[0];
      return { eye: [sp.pos[0], 1.62, sp.pos[2]], yaw: sp.yaw, pitch: 0, fov: 90 };
    },
    tSpawn: function () {
      var sp = W.spawns.t[0];
      return { eye: [sp.pos[0], 1.62, sp.pos[2]], yaw: sp.yaw, pitch: 0, fov: 90 };
    },
    mid: function () { return { eye: [0, 1.62, 10], yaw: 0, pitch: 0, fov: 90 }; },
    midnorth: function () { return { eye: [0, 1.62, -10], yaw: Math.PI, pitch: 0, fov: 90 }; },
    siteA: function () { return { eye: [-17, 1.62, -14], yaw: Math.PI, pitch: -0.05, fov: 90 }; },
    siteB: function () { return { eye: [17, 1.62, -12], yaw: Math.PI, pitch: -0.05, fov: 90 }; },
    siteA2: function () { return { eye: [-11, 1.62, 0], yaw: Math.PI * 0.75, pitch: -0.03, fov: 90 }; },
    siteB2: function () { return { eye: [12.5, 1.62, -1], yaw: Math.PI * 0.3, pitch: -0.03, fov: 90 }; },
    longA: function () { return { eye: [-25, 1.62, 23], yaw: 0, pitch: 0, fov: 90 }; },
    longB: function () { return { eye: [25, 1.62, 23], yaw: 0, pitch: 0, fov: 90 }; },
    tunnels: function () { return { eye: [6, 1.62, 12], yaw: Math.PI * 0.5, pitch: 0, fov: 90 }; }
  };

  function run3D() {
    var cam = (VIEWS[view] || VIEWS.ctspawn)();
    panel.textContent = info + '\n\nrenderer: ' + (renderer && renderer.isNull ? 'NULL (no webgl)' : 'webgl ok') +
      '\ncamera eye ' + cam.eye.map(function (v) { return v.toFixed(1); }).join(', ') +
      '  yaw ' + cam.yaw.toFixed(2) + '  pitch ' + cam.pitch.toFixed(2);
    legend.innerHTML = 'view=' + view + '\n?view=top | over | ctspawn | tSpawn | mid | midnorth | siteA | siteB | longA | longB | tunnels';
    var t0 = performance.now();
    function frame() {
      renderer.setCamera(cam.eye, cam.yaw, cam.pitch, cam.fov);
      renderer.beginFrame();
      try { W.render(renderer); } catch (e) { showErr('world.render: ' + (e && e.message)); }
      renderer.endFrame();
      if (renderer.stats) {
        var st = renderer.stats;
        panel.textContent = info + '\n\nview=' + view + '  draws ' + st.draws + '  tris ' + st.tris +
          (renderer.isNull ? '  [NULL RENDERER]' : '');
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (view === 'top') drawTop();
  else run3D();
})();
</script>
</body>
</html>
